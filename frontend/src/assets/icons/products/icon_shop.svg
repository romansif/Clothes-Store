<!-- Разноцветная иконка пакетов с покупками -->
<svg 
  xmlns="http://www.w3.org/2000/svg" 
  width="50"
  height="50"
  viewBox="0 0 24 24" 
  fill="none" 
>
  <!-- 1. ЗАДНИЙ ПАКЕТ (Более светлый) -->
  
  <!-- Ручка заднего пакета (Светло-оранжевый контур) -->
  <path 
    d="M7 6V4.5a2 2 0 0 1 2-2h.5a2 2 0 0 1 2 2V6" 
    stroke="#FDBA74" 
    stroke-width="1.2" 
    stroke-linecap="round"
  />
  <!-- Тело заднего пакета (Очень светлая заливка) -->
  <rect 
    x="3" y="6" 
    width="9" height="13" 
    rx="1.5" 
    fill="#FFEDD5" 
    stroke="#FDBA74" 
    stroke-width="0.5"
  />
  
  
  <!-- 2. ПЕРЕДНИЙ ПАКЕТ (Яркий, основной) -->
  
  <!-- Ручка переднего пакета (Яркий оранжевый контур) -->
  <path 
    d="M14 6V4.5a2 2 0 0 1 2-2h.5a2 2 0 0 1 2 2V6" 
    stroke="#F97316" 
    stroke-width="1.5" 
    stroke-linecap="round"
  />
  <!-- Тело переднего пакета (Яркая оранжевая заливка) -->
  <rect 
    x="10" y="6" 
    width="9" height="13" 
    rx="1.5" 
    fill="#FB923C" 
  />
  
  <!-- Декоративные белые полоски на переднем пакете -->
  <rect x="12" y="9" width="5" height="1" rx="0.5" fill="white" fill-opacity="0.6"/>
  <rect x="12" y="11.5" width="5" height="1" rx="0.5" fill="white" fill-opacity="0.6"/>
  <rect x="12" y="14" width="3" height="1" rx="0.5" fill="white" fill-opacity="0.6"/>
</svg>
